[package]
  url = "https://xcb.freedesktop.org/dist/xcb-proto-1.17.0.tar.xz"
  ref = "1.17.0"

[[build_configs]]
  build_system = "makefiles"
  system_name_except = "windows"
  build_tools = ["python3"]
  envs = ["PYTHON3_PATH=${PYTHON3_PATH}"]
  dev_dependencies = ["macros@1.20.2"]
  options = ["--host=${HOST}"]