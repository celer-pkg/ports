[package]
  url = "https://www.x.org/releases/individual/xcb/xcb-util-image-0.4.1.tar.xz"
  ref = "0.4.1"

[[build_configs]]
  build_system = "makefiles"
  system_name_except = "windows"
  dev_dependencies = ["macros@1.20.2", "automake@1.18", "libtool@2.5.4"]
  dependencies = ["libx11@1.8.11", "xcb-util@0.4.1"]
  options = ["--host=${HOST}"]