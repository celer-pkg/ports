[package]
  url = "https://www.x.org/releases/individual/xcb/xcb-util-cursor-0.1.5.tar.xz"
  ref = "0.1.5"

[[build_configs]]
  build_system = "makefiles"
  system_name_except = "windows"
  dependencies = ["libxcb-image@0.1.5", "xcb-util-renderutil@0.3.10"]
  dev_dependencies = ["macros@1.20.2", "libtool@2.5.4"]
  options = ["--host=${HOST}"]
