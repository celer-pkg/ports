[package]
  url = "https://gitlab.freedesktop.org/xorg/lib/libxcomposite.git"
  ref = "libXcomposite-0.4.6"
  depth = 1

[[build_configs]]
  build_system = "makefiles"
  system_name_except = "windows"
  dependencies = ["libxfixes@6.0.1"]
  dev_dependencies = ["macros@1.20.2", "pkgconf@2.4.3"]
  envs = ["NOCONFIGURE=1"]
  pre_configure = ["./autogen.sh"]
  options = ["--host=${HOST}"]