[package]
  url = "https://github.com/zeromq/libzmq.git"
  ref = "v4.3.5"
  depth = 1

[[build_configs]]
  build_system = "cmake"
  options = [
    "-DWITH_PERF_TOOL=OFF",
    "-DZMQ_BUILD_TESTS=OFF",
    "-DENABLE_CPACK=OFF",
    "-DZMQ_WIN32_WINNT=0x0602",
    "-DZEROMQ_CMAKECONFIG_INSTALL_DIR=lib/cmake/ZeroMQ",
  ]
