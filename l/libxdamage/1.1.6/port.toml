[package]
  url = "https://gitlab.freedesktop.org/xorg/lib/libxdamage.git"
  ref = "libXdamage-1.1.6"
  depth = 1

[[build_configs]]
  build_system = "makefiles"
  system_name_except = "windows"
  dependencies = ["libxfixes@6.0.1"]
  dev_dependencies = ["macros@1.20.2", "libtool@2.5.4"]
  envs = ["NOCONFIGURE=1"]
  pre_configure = ["./autogen.sh"]
  options = ["--host=${HOST}"]