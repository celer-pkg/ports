[package]
  url = "https://github.com/guillemj/libmd.git"
  ref = "1.1.0"
  depth = 1

[[build_configs]]
  build_system = "makefiles"
  system_name_except = "windows"
  build_in_source = true
  dev_dependencies = ["libtool@2.5.4", "macros@1.20.2"]
  envs = ["NOCONFIGURE=1"]
  pre_configure = ["./autogen"]
  options = ["--host=${HOST}"]
