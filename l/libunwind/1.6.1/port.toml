[package]
  url = "https://download-mirror.savannah.gnu.org/releases/libunwind/libunwind-1.6.1.tar.gz"
  ref = "1.6.1"
  depth = 1

[[build_configs]]
  build_system = "makefiles"
  system_name_except = "windows"
  envs = ["LDFLAGS=-Wl,-rpath-link,${BUILD_DIR}/src/.libs"]
  options = ["--host=${HOST}"]