[package]
  url = "https://gitlab.freedesktop.org/xorg/lib/libxfixes.git"
  ref = "libXfixes-6.0.1"
  depth = 1

[[build_configs]]
  build_system = "makefiles"
  system_name_except = "windows"
  dependencies = ["libx11@1.8.11"]
  dev_dependencies = ["macros@1.20.2"]
  envs = ["NOCONFIGURE=1"]
  pre_configure = ["./autogen.sh"]
  options = ["--host=${HOST}"]