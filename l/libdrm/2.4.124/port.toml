[package]
  url = "https://gitlab.freedesktop.org/mesa/libdrm.git"
  ref = "libdrm-2.4.124"
  depth = 1

# ================ build for aarch64-linux ================ #
[[build_configs]]
  build_system = "meson"
  system_name_except = "windows"
  dependencies = ["xcb-proto@1.17.0", "libpciaccess@0.18.1"]
  dev_dependencies = ["pkgconf@2.4.3"]
  options = ["-Dtests=false", "-Dintel=enabled"]
