[package]
  url = "https://github.com/chriskohlhoff/asio.git"
  ref = "asio-1-38-2"
  depth = 1

[[build_configs]]
  build_system = "makefiles"
  system_name_except = "windows"
  dev_dependencies = ["macros@1.20.2"]
  envs = ["NOCONFIGURE=1"]
  pre_configure = ["./autogen.sh"]
  options = ["--host=${HOST}"]
