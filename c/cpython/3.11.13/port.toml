[package]
  url = "https://github.com/python/cpython.git"
  ref = "v3.11.13"
  depth = 1

[[build_configs]]
  build_system = "makefiles"
  system_name_except = "windows"
  build_tools = ["python3"]
  dev_dependencies_linux = ["cpython@3.11.13"]
  options = [
    "--host=x86_64-linux-gnu",
    "--build=${HOST}",
    "--with-build-python=${DEV_DEPS_DIR}/bin/python3",
    "--disable-ipv6",
    "--enable-optimizations",
    "--with-ensurepip=no",
    "ac_cv_file__dev_ptmx=no",
    "ac_cv_file__dev_ptc=no",
    "ac_cv_have_long_long_format=yes",
  ]
